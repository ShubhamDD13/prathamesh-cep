<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Products | Dukaan</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%230E7C66'/%3E%3Ccircle cx='16' cy='16' r='6' fill='white'/%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body class="has-tabs">

  <!-- ========== TOP BAR ========== -->
  <header class="topbar">
    <div class="wrap bar">
      <a class="brand" href="index.html"><span class="dot"></span>Dukaan</a>

      <nav class="tabs" aria-label="Main">
        <a href="dashboard.html">Dashboard</a>
        <a href="products.html" aria-current="page">Products</a>
        <a href="qr.html">QR code</a>
      </nav>

      <div class="navlinks">
        <a class="hide-sm" id="myShopLink" href="#">My shop</a>
        <button class="linkish" id="logoutBtn" type="button">Log out</button>
      </div>
    </div>
  </header>

  <main>
    <div class="wrap page">

      <!-- Page title + Add button -->
      <div class="page-head">
        <div>
          <h1>Products</h1>
          <p>Manage what customers see in your shop.</p>
        </div>
        <button class="btn" id="addBtn" type="button">+ Add product</button>
      </div>


      <!-- ========== ADD / EDIT FORM (hidden until you press Add or Edit) ========== -->
      <section class="panel" id="formPanel" aria-labelledby="formTitle">

        <div class="panel-head">
          <h2 class="sub" id="formTitle" style="margin:0">Add a product</h2>
          <button class="textbtn" id="closeBtn" type="button">Close</button>
        </div>

        <form id="productForm" novalidate>

          <div class="field">
            <label for="productName">Product name</label>
            <input id="productName" type="text" placeholder="e.g. Fresh milk" maxlength="80">
          </div>

          <div class="row2">
            <div class="field">
              <label for="productPrice">Price (₹)</label>
              <input id="productPrice" type="number" inputmode="decimal" min="0" step="any" placeholder="e.g. 30">
            </div>

            <div class="field">
              <label for="productCategory">Category</label>
              <select id="productCategory">
                <option value="" disabled selected>Select category</option>
                <option value="grocery">Grocery</option>
                <option value="dairy">Dairy</option>
                <option value="bakery">Bakery</option>
                <option value="beverages">Beverages</option>
                <option value="snacks">Snacks</option>
                <option value="other">Other</option>
              </select>
            </div>
          </div>

          <!-- PHOTO -->
          <div class="field">
            <label>Photo <small>(optional)</small></label>
            <div class="photo">
              <div class="photo-prev" id="photoPreview">No photo</div>
              <div class="photo-btns">
                <button class="btn ghost small" id="photoPickBtn" type="button">Choose photo</button>
                <button class="textbtn danger" id="photoRemoveBtn" type="button" hidden>Remove</button>
                <!-- The real file picker is hidden; the button above opens it -->
                <input id="photoInput" type="file" accept="image/*" hidden>
              </div>
            </div>
          </div>

          <div class="field">
            <label for="productDescription">Description <small>(optional)</small></label>
            <textarea id="productDescription" rows="2" maxlength="120" placeholder="Short description"></textarea>
          </div>

          <label class="chk">
            <input type="checkbox" id="productAvailable" checked>
            Available right now
          </label>

          <!-- Error message appears here -->
          <div id="formMessage" class="msg" role="alert"></div>

          <button class="btn" type="submit" id="saveBtn">Save product</button>

        </form>
      </section>


      <!-- ========== PRODUCT LIST (filled in by products.js) ========== -->
      <div id="productList"></div>

    </div>
  </main>

  <div id="toast" class="toast" role="status" aria-live="polite"></div>

  <script src="common.js"></script>
  <script src="products.js"></script>
</body>
</html>
