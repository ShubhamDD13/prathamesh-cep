<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Shop | Dukaan</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%230E7C66'/%3E%3Ccircle cx='16' cy='16' r='6' fill='white'/%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- This is the page customers see when they scan the QR code -->

  <!-- ========== TOP BAR ========== -->
  <header class="topbar">
    <div class="wrap bar">
      <a class="brand" href="index.html"><span class="dot"></span>Dukaan</a>
      <div class="navlinks">
        <a href="register.html">Create your own shop</a>
      </div>
    </div>
  </header>

  <main>

    <!-- ========== SHOP NAME ========== -->
    <div class="cust-head">
      <div class="wrap">
        <h1 id="shopName">Loading...</h1>
        <p id="shopInfo"></p>
        <a class="btn" id="callBtn" href="#" hidden>Call shop</a>
      </div>
    </div>

    <div class="wrap page" style="padding-top:8px">

      <!-- Category buttons (filled in by shop.js) -->
      <div class="chips" id="chips"></div>

      <!-- Products (filled in by shop.js) -->
      <div id="productList"></div>

      <p class="fine">Made with <a href="index.html" style="color:var(--accent);font-weight:700">Dukaan</a>.
        Want one for your own stall? <a href="register.html" style="color:var(--accent);font-weight:700">Create a shop</a>.</p>

    </div>
  </main>

  <script src="common.js"></script>
  <script src="shop.js"></script>
</body>
</html>
