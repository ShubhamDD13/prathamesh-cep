<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>QR code | Dukaan</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%230E7C66'/%3E%3Ccircle cx='16' cy='16' r='6' fill='white'/%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body class="has-tabs">

  <!-- ========== TOP BAR ========== -->
  <header class="topbar">
    <div class="wrap bar">
      <a class="brand" href="index.html"><span class="dot"></span>Dukaan</a>

      <nav class="tabs" aria-label="Main">
        <a href="dashboard.html">Dashboard</a>
        <a href="products.html">Products</a>
        <a href="qr.html" aria-current="page">QR code</a>
      </nav>

      <div class="navlinks">
        <a class="hide-sm" id="myShopLink" href="#">My shop</a>
        <button class="linkish" id="logoutBtn" type="button">Log out</button>
      </div>
    </div>
  </header>

  <main>
    <div class="wrap page">

      <div class="page-head">
        <div>
          <h1>QR code</h1>
          <p>Print it and place it near your counter, or share the link.</p>
        </div>
      </div>

      <div class="qr">

        <!-- The QR code picture is drawn here -->
        <div class="qrbox">
          <canvas id="qrCanvas" aria-label="QR code for your shop"></canvas>
        </div>

        <div>
          <h2 id="shopTitle">Your shop</h2>
          <p class="muted" style="margin:8px 0 20px;max-width:44ch">
            Customers scan this code with their phone camera to open your shop and see your products with photos.
          </p>

          <label for="linkInput" style="font-weight:600;font-size:.92rem">Shop link</label>
          <div class="copy">
            <input id="linkInput" type="text" readonly>
            <button class="btn ghost small" id="copyBtn" type="button">Copy</button>
          </div>

          <div class="cta-row">
            <button class="btn" id="downloadBtn" type="button">Download QR code</button>
            <a class="btn ghost" id="previewLink" href="#">Preview shop</a>
          </div>

          <p class="note" id="qrNote"></p>
        </div>

      </div>

    </div>
  </main>

  <div id="toast" class="toast" role="status" aria-live="polite"></div>

  <!-- qrcode.min.js draws the QR code -->
  <script src="qrcode.min.js"></script>
  <script src="common.js"></script>
  <script src="qr.js"></script>
</body>
</html>
