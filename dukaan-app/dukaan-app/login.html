<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Log in | Dukaan</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%230E7C66'/%3E%3Ccircle cx='16' cy='16' r='6' fill='white'/%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- ========== TOP BAR ========== -->
  <header class="topbar">
    <div class="wrap bar">
      <a class="brand" href="index.html"><span class="dot"></span>Dukaan</a>
      <div class="navlinks">
        <a class="btn small" href="register.html">Get started</a>
      </div>
    </div>
  </header>

  <main>
    <div class="authbox">

      <a class="back" href="index.html">← Back to home</a>
      <h1>Welcome back</h1>
      <p class="muted sub">Enter your phone number and password.</p>

      <form id="loginForm" novalidate>

        <div class="field">
          <label for="phone">Phone number</label>
          <input id="phone" type="tel" inputmode="numeric" maxlength="10" placeholder="10-digit mobile number" autocomplete="tel">
        </div>

        <div class="field">
          <label for="password">Password</label>
          <input id="password" type="password" placeholder="Your password" autocomplete="current-password">
        </div>

        <!-- Error message appears here -->
        <div id="formMessage" class="msg" role="alert"></div>

        <button class="btn block" type="submit" id="submitBtn">Log in</button>

        <p class="switch">Don't have a shop yet? <a href="register.html">Create one</a></p>

      </form>
    </div>
  </main>

  <div id="toast" class="toast" role="status" aria-live="polite"></div>

  <script src="common.js"></script>
  <script src="login.js"></script>
</body>
</html>
