<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Create your shop | Dukaan</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%230E7C66'/%3E%3Ccircle cx='16' cy='16' r='6' fill='white'/%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- ========== TOP BAR ========== -->
  <header class="topbar">
    <div class="wrap bar">
      <a class="brand" href="index.html"><span class="dot"></span>Dukaan</a>
      <div class="navlinks">
        <a href="login.html">Log in</a>
      </div>
    </div>
  </header>

  <main>
    <div class="authbox">

      <a class="back" href="index.html">← Back to home</a>
      <h1>Create your shop</h1>
      <p class="muted sub">Enter your business details to get started.</p>

      <form id="registerForm" novalidate>

        <!-- Shop details -->
        <fieldset>
          <legend>Shop</legend>

          <div class="field">
            <label for="shopName">Shop name</label>
            <input id="shopName" type="text" placeholder="e.g. Sharma General Store" autocomplete="organization">
          </div>

          <div class="row2">
            <div class="field">
              <label for="ownerName">Owner name</label>
              <input id="ownerName" type="text" placeholder="Your name" autocomplete="name">
            </div>

            <div class="field">
              <label for="category">Category</label>
              <select id="category">
                <option value="" disabled selected>Select category</option>
                <option value="grocery">Grocery</option>
                <option value="clothing">Clothing</option>
                <option value="food">Food &amp; Beverages</option>
                <option value="electronics">Electronics</option>
                <option value="stationery">Stationery</option>
                <option value="other">Other</option>
              </select>
            </div>
          </div>

          <div class="field">
            <label for="location">Location</label>
            <input id="location" type="text" placeholder="e.g. Chembur, Mumbai">
          </div>
        </fieldset>

        <!-- Contact -->
        <fieldset>
          <legend>Contact</legend>

          <div class="field">
            <label for="phone">Phone number</label>
            <input id="phone" type="tel" inputmode="numeric" maxlength="10" placeholder="10-digit mobile number" autocomplete="tel">
          </div>
        </fieldset>

        <!-- Password -->
        <fieldset>
          <legend>Account</legend>

          <div class="row2">
            <div class="field">
              <label for="password">Password</label>
              <input id="password" type="password" placeholder="At least 6 characters" autocomplete="new-password">
            </div>

            <div class="field">
              <label for="confirmPassword">Confirm password</label>
              <input id="confirmPassword" type="password" placeholder="Repeat password" autocomplete="new-password">
            </div>
          </div>
        </fieldset>

        <!-- Error message appears here -->
        <div id="formMessage" class="msg" role="alert"></div>

        <button class="btn block" type="submit" id="submitBtn">Create my shop</button>

        <p class="switch">Already have a shop? <a href="login.html">Log in</a></p>

      </form>
    </div>
  </main>

  <div id="toast" class="toast" role="status" aria-live="polite"></div>

  <script src="common.js"></script>
  <script src="register.js"></script>
</body>
</html>
